<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width">
    <link href="style.css" rel="stylesheet" type="text/css" />
    <title>Full Game Stats </title>
  </head>

  <body>
    <!-- header row with logo -->
     <!-- header row with logo -->
    <div class="header">
        <nav>
            <img id="tentacles" src="assets/tentacles.png">
            <h1 class="header-text">  Sea Monster Crowdfunding </h1>
            <ul>
                <li><a
                    href="index.html" 
                    style="text-decoration:none; color:black;"> Home </a></li>  <!--class="nav-bar" after the a  -->

                <li> <p onClick="document.getElementById('searchBar').scrollIntoView();"> Games </p> </li>
                    <!-- didnt do search bar for element bc would scroll too far --> 
                
                <li> <input
                        type="image" 
                        src="https://cdn-icons-png.freepik.com/512/8539/8539336.png"
                        width="20" 
                        height="20"
                        onClick="document.getElementById('button-container').scrollIntoView();"
                    /> </li>    
            </ul>

            <!-- should probably add it to class nav bar but im feeling lazy and this works so we're keeping it-->
            <!-- yeah except it didnt work -->

        </nav>
    </div>

    <!-- for if i want the search bar words to be below
        <div  class="header">
            <a href="index.html" style="text-decoration:none; color:black; text-align: right;"> Home</a>
        </div> 
     -->

    <div class="game-list"></div>
    <template data-user-template>
        <div class="gameOne">
            <div class="header"></div>
            <div class="body"></div>
        </div>
    </template>

    <!-- rest of the website -->
    <br>
    <h4> Here are the complete statistics for our supported games! </h4>
        <!-- list of games funded by Sea Monster -->
        <div id="button-container">
            <button class= "game-card" id="all-btn">Show All Games</button>       
            <button class= "game-card" id="unfunded-btn">Show Unfunded Only</button>
            <button class= "game-card" id="funded-btn">Show Funded Only</button>
            <button class= "game-card" id="amount-btn">Amount Raised Filter</button>
            <button class= "game-card" id="backers-btn">Backers Filter</button>
            <button class= "game-card" id="target-btn">Target Amount Filter</button>
        </div>

        <!-- search bar stuff -->
        <div class="search-wrapper">
            <label for="search"> Search Our Game Catalog! &nbsp; </label>
            <input type="search" id="searchBar" color="black">
        </div>

    <div id="games-container"></div>

    <script type="module" src="fullstats.js"></script>
  </body>
</html>
